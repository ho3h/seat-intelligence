<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who sits next to whom? The White House AI lunch</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* Monotone state-dinner stationery: black ink on white card, engraved serif display, a book serif for reading. One caption card over a full-screen chart. Deliberately single-theme. */
  :root { --ink:#151515; --mute:#6b6b68; --paper:#fbfbf9; --soft:#efeeea; --hair:#d6d4ce; --bad:#151515; --good:#151515; --blue:#151515;
          --display:"Cormorant Garamond", "EB Garamond", Georgia, serif; --text:"Source Serif 4", Georgia, "Times New Roman", serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); }
  body { font:15.5px/1.55 var(--text); overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  #stage.drag { cursor:grabbing; }
  #stage.can-pick { cursor:pointer; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  button { font:inherit; color:inherit; }
  .btn { background:var(--paper); border:1px solid var(--ink); padding:6px 16px; cursor:pointer; border-radius:0; white-space:nowrap; font-family:var(--text); font-size:14.5px; letter-spacing:.02em; }
  .btn:hover { background:var(--soft); }
  .btn.primary { font-variant:small-caps; letter-spacing:.08em; font-size:16px; }
  .btn.primary { background:var(--ink); color:#fff; }
  .btn.primary:hover { background:#333; }
  .btn.small { padding:3px 10px; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .link { background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; cursor:pointer; font-size:14px; font-family:var(--text); }
  a { color:var(--ink); text-underline-offset:3px; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .nav { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); left:14px; display:flex; flex-direction:column; gap:6px; }
  @media (max-width:1020px) { .nav { display:none; } }
  /* the caption card */
  #cap { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:min(560px, calc(100% - 24px));
         background:var(--paper); border:1px solid var(--ink); box-shadow:0 1px 0 var(--ink), 0 10px 30px rgba(0,0,0,.08); }
  .cap-in { padding:12px 16px 4px; max-height:32vh; overflow:auto; }
  .cap-in h1 { margin:0 0 6px; font:600 28px/1.1 var(--display); letter-spacing:.005em; text-wrap:balance; }
  .cap-in p { margin:0 0 8px; }
  .rule { font:italic 600 21px/1.25 var(--display); margin:0 0 8px !important; }
  .keyl { color:var(--mute); font-size:14px; white-space:nowrap; }
  .dot { display:inline-block; width:17px; height:17px; border-radius:50%; color:#fff; font-size:10.5px; font-weight:600; font-family:var(--text); text-align:center; line-height:17px; margin:0 3px 0 8px; vertical-align:-3px; font-style:normal; }
  .fine { color:var(--mute); font-size:13px; }
  .code { display:block; font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--soft); padding:6px 10px; white-space:pre; margin:4px 0 8px; overflow-x:auto; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 16px 12px; flex-wrap:wrap; }
  .bar .sp { flex:1; }
  .chips { display:flex; gap:6px; }
  .dots { display:flex; gap:5px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--hair); display:block; }
  .dots i.on { background:var(--ink); }
  .links { display:flex; gap:16px; flex-wrap:wrap; padding:0 16px 12px; }
  /* the doomsday clock lives in the frame: a stark quarter dial counting down to midnight */
  .hud { position:absolute; top:calc(10px + env(safe-area-inset-top, 0px)); right:10px; display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff; padding:8px 14px 8px 8px; }
  .hud svg { width:54px; height:54px; flex:none; overflow:visible; }
  .hud .face { fill:#2a2a2a; }
  .hud .ticks rect { fill:#fff; }
  .hud .hand line { stroke:#fff; stroke-width:3; stroke-linecap:round; }
  .hud .hand { transform-origin:58px 58px; transition:transform .7s cubic-bezier(.3,1.6,.5,1); }
  .hud .pivot { fill:#fff; }
  .hud b { display:block; font:600 21px/1.05 var(--display); letter-spacing:.06em; font-variant-numeric:lining-nums tabular-nums; text-transform:uppercase; }
  .hud .cap1 { display:block; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#bdbdb8; margin-top:3px; }
  .hud #hudred { display:block; font-size:12.5px; color:#e7e7e7; }
  .hud.late b { text-decoration:underline; text-underline-offset:4px; }
  .hud.ok { background:var(--paper); color:var(--ink); border:1px solid var(--ink); }
  .hud.ok .face { fill:var(--soft); }
  .hud.ok .ticks rect, .hud.ok .pivot { fill:var(--ink); }
  .hud.ok .hand line { stroke:var(--ink); }
  .hud.ok .cap1, .hud.ok #hudred { color:var(--mute); }
  .hud.strike { animation:strike .5s ease-in-out 2; }
  @keyframes strike { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .toast { position:absolute; top:calc(62px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); max-width:min(520px, calc(100% - 24px)); background:var(--ink); color:#fff; padding:10px 18px; font:italic 500 19px/1.3 var(--display); pointer-events:none; opacity:0; transition:opacity .25s; text-align:center; }
  .toast.on { opacity:1; }
  /* How it works */
  #sheet { position:fixed; inset:0; background:rgba(17,17,17,.35); overflow:auto; }
  .sheet-in { background:var(--paper); max-width:640px; margin:calc(24px + env(safe-area-inset-top, 0px)) auto 24px; border:1px solid var(--ink); position:relative; }
  #sheetclose { position:sticky; top:0; float:right; margin:10px; }
  .pane { padding:18px 22px 22px; }
  .kicker { margin:0 0 6px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .pane h1 { margin:0 0 10px; font:600 32px/1.1 var(--display); text-wrap:balance; }
  .pane h2 { margin:24px 0 8px; font:600 23px/1.2 var(--display); }
  .pane p { margin:0 0 10px; }
  .flow { margin:6px 0 14px; }
  .flow .box { border:1px solid var(--ink); padding:8px 10px; }
  .flow .box b { display:block; }
  .flow .box span { font-size:13.5px; color:var(--mute); }
  .flow .box.hi { background:var(--soft); }
  .flow .arrow { text-align:center; line-height:1; padding:3px 0; color:var(--mute); }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 12px; }
  .fact { border:1px solid var(--ink); padding:8px 10px; min-width:0; }
  .fact b { display:block; font:600 30px/1.05 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .fact span { font-size:13.5px; color:var(--mute); }
  .bars { margin:6px 0 14px; }
  .bars .lab { font-size:14px; margin:6px 0 2px; display:flex; justify-content:space-between; gap:10px; }
  .bars .track { height:10px; background:var(--soft); border:1px solid var(--hair); }
  .bars .fill { height:8px; background:var(--ink); }
  .fig { display:block; width:100%; max-width:320px; height:auto; margin:6px 0 4px; }
  .fig .b { fill:var(--soft); stroke:var(--ink); stroke-width:1.5; }
  .fig .n { fill:var(--paper); stroke:var(--ink); stroke-width:1.8; }
  .fig .w { fill:none; stroke:var(--ink); stroke-width:1.8; }
  .fig .a { stroke:var(--blue); stroke-width:3; }
  .fig .t { fill:var(--mute); font-size:13px; font-family:inherit; }
  .fig .m { fill:var(--ink); font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pane ul { margin:0 0 10px; padding-left:18px; }
  .pane li { margin:0 0 6px; }
  @media (max-width:600px) {
    .cap-in { padding:10px 12px 2px; max-height:30vh; }
    .cap-in h1 { font-size:24px; }
    .rule { font-size:18px; }
    .bar { padding:6px 12px 10px; }
    .links { padding:0 12px 10px; gap:12px; }
    .hud { padding:6px 10px 6px 6px; gap:8px; }
    .hud svg { width:40px; height:40px; }
    .hud b { font-size:17px; }
    .nav { display:none; }
    .facts { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .toast, .hud .hand { transition:none; } .hud.strike { animation:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="Seating chart of the White House AI lunch"></canvas>
  <div class="nav"><button class="btn small" id="fit" type="button">Lunch table</button><button class="btn small" id="far" type="button">Zoom out</button></div>
  <div class="hud" id="hud" hidden aria-live="polite"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M58 58 L58 6 A52 52 0 0 0 6 58 Z" class="face"/><g class="ticks"><rect x="55.5" y="9" width="5" height="5"/><rect x="29.5" y="16" width="5" height="5" transform="rotate(-30 32 18)"/><rect x="14" y="31" width="5" height="5" transform="rotate(-60 16 33)"/></g><g id="hand" class="hand"><line x1="58" y1="58" x2="58" y2="12"/></g><circle cx="58" cy="58" r="3.2" class="pivot"/></svg><div><b id="doomt"></b><span class="cap1">AI Doomsday Clock</span><span id="hudred"></span></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section id="cap" aria-label="Story"></section>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="How it works"><div class="sheet-in"><button class="btn small" type="button" id="sheetclose">Close</button><div id="sheetbody"></div></div></div>
<script>
// Seating function for the luncheon page. A line-for-line port of genome/hero1/lang.py
// (parse, prep, ref_sections, violations, posted_assignment) and of the HERO-6 named words
// `avoid` and `pair` (genome/hero6/lang6.py). Checked against the Python reference by
// test_seating.js; the Python reference is itself checked against the verified net.
var Seating = (function () {
  var CATS = ["ai_lab", "big_tech", "chips", "software_security", "investor", "government", "unlabelled"];
  var CID = {}; CATS.forEach(function (c, i) { CID[c] = i; });
  var INF = (1 << 24) - 1, MAXCAP = 6;

  function uniqSorted(a) { return Array.from(new Set(a)).sort(function (x, y) { return x - y; }); }
  function canon(p) {
    var limits = p.limits.map(function (l) { return [uniqSorted(l[0]), l[1]]; });
    limits.sort(function (a, b) { return cmp(a, b); });
    var seen = {}, aparts = [];
    p.aparts.forEach(function (x) { var t = [Math.min(x[0], x[1]), Math.max(x[0], x[1])]; var k = t.join(","); if (!seen[k]) { seen[k] = 1; aparts.push(t); } });
    aparts.sort(function (a, b) { return cmp(a, b); });
    // named words are symmetric: smaller token first, sorted, duplicates removed (lang6.Policy6.canon)
    function named(xs) {
      var seen = {}, out = [];
      (xs || []).forEach(function (x) { var t = x[0] < x[1] ? [x[0], x[1]] : [x[1], x[0]]; var k = t.join("\u0000"); if (!seen[k]) { seen[k] = 1; out.push(t); } });
      out.sort(function (a, b) { return cmp(a, b); });
      return out;
    }
    return { cap: p.cap, togCompany: p.togCompany, togCats: uniqSorted(p.togCats), limits: limits, aparts: aparts, order: p.order.slice(), avoids: named(p.avoids), pairs: named(p.pairs) };
  }
  function cmp(a, b) {
    if (Array.isArray(a)) { for (var i = 0; i < Math.min(a.length, b.length); i++) { var c = cmp(a[i], b[i]); if (c) return c; } return a.length - b.length; }
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function emptyPolicy() { return { cap: MAXCAP, togCompany: false, togCats: [], limits: [], aparts: [], order: [], avoids: [], pairs: [] }; }

  function parse(text) {
    var lines = text.trim().split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l && l.indexOf("```") !== 0; });
    if (!lines.length || (lines.length === 1 && lines[0] === "none")) return emptyPolicy();
    var cap = null, tc = false, tk = [], lim = [], apt = [], order = null, avd = [], par = [];
    lines.forEach(function (l) {
      var t = l.split(/\s+/), w = t[0];
      if (w === "size" && t.length === 2 && /^\d+$/.test(t[1])) {
        if (cap !== null) throw new Error("size given twice");
        cap = parseInt(t[1], 10);
        if (cap < 1 || cap > MAXCAP) throw new Error("size must be 1 to " + MAXCAP + ": " + l);
      } else if (w === "together" && t.length === 2) {
        if (t[1] === "company") tc = true;
        else if (t[1] in CID) tk.push(CID[t[1]]);
        else throw new Error("unknown category: " + l);
      } else if (w === "limit" && t.length >= 3 && /^\d+$/.test(t[t.length - 1]) && t.slice(1, -1).every(function (x) { return x in CID; })) {
        var k = parseInt(t[t.length - 1], 10);
        if (k < 1 || k > 6) throw new Error("limit must be 1 to 6: " + l);
        lim.push([t.slice(1, -1).map(function (x) { return CID[x]; }), k]);
      } else if (w === "apart" && t.length === 3 && t[1] in CID && t[2] in CID && t[1] !== t[2]) {
        apt.push([CID[t[1]], CID[t[2]]]);
      } else if (w === "order" && t.length >= 2 && t.slice(1).every(function (x) { return x in CID; })) {
        if (order !== null) throw new Error("order given twice");
        var ids = t.slice(1).map(function (x) { return CID[x]; });
        if (new Set(ids).size !== ids.length) throw new Error("category repeated in order");
        order = ids;
      } else if (w === "avoid" && t.length === 3 && t[1] !== t[2]) {
        avd.push([t[1], t[2]]);   // two named guests or companies, spaces written as _
      } else if (w === "pair" && t.length === 3 && t[1] !== t[2]) {
        par.push([t[1], t[2]]);   // same: these two sit in one section
      } else throw new Error("not a word I know: " + l);
    });
    return canon({ cap: cap === null ? MAXCAP : cap, togCompany: tc, togCats: tk, limits: lim, aparts: apt, order: order || [], avoids: avd, pairs: par });
  }

  function toText(p) {
    p = canon(p); var L = [];
    if (p.cap !== MAXCAP) L.push("size " + p.cap);
    if (p.togCompany) L.push("together company");
    p.togCats.forEach(function (c) { L.push("together " + CATS[c]); });
    p.limits.forEach(function (l) { L.push("limit " + l[0].map(function (c) { return CATS[c]; }).join(" ") + " " + l[1]); });
    p.aparts.forEach(function (a) { L.push("apart " + CATS[a[0]] + " " + CATS[a[1]]); });
    if (p.order.length) L.push("order " + p.order.map(function (c) { return CATS[c]; }).join(" "));
    (p.avoids || []).forEach(function (a) { L.push("avoid " + a[0] + " " + a[1]); });
    (p.pairs || []).forEach(function (a) { L.push("pair " + a[0] + " " + a[1]); });
    return L.length ? L.join("\n") : "none";
  }

  function rules(p) {
    var out = [];
    p.limits.forEach(function (l) { var m = 0; l[0].forEach(function (c) { m += 1 << c; }); out.push([m, 0, l[1]]); });
    p.aparts.forEach(function (a) { out.push([1 << a[0], 1 << a[1], INF]); });
    return out;
  }

  // guests: [{org, cat}]   -> sequence [{i, c, s}]
  function prep(guests, p) {
    var tk = {}; p.togCats.forEach(function (c) { tk[c] = 1; });
    var rank = {}; p.order.forEach(function (c, i) { rank[c] = i; });
    var R = p.order.length, members = new Map();
    guests.forEach(function (g, i) {
      var key = tk[g.cat] ? "c" + g.cat : (p.togCompany && g.org !== null ? "o" + g.org : "g" + i);
      if (!members.has(key)) members.set(key, []);
      members.get(key).push(i);
    });
    var units = [];
    members.forEach(function (ms) {
      var c = guests[ms[0]].cat;
      units.push({ r: (c in rank) ? rank[c] : R, first: ms[0], ms: ms, c: c });
    });
    units.sort(function (a, b) { return a.r - b.r || a.first - b.first; });
    // `pair X Y`: every unit holding a guest who matches X or Y is merged into one unit (union-find); the merged unit
    // sits at its earliest part's position, members = parts in position order (genome/hero6/lang6.py prep)
    if (p.pairs && p.pairs.length) {
      var par = units.map(function (u, k) { return k; });
      var find = function (x) { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
      p.pairs.forEach(function (pr) {
        var hit = [];
        units.forEach(function (u, k) { if (u.ms.some(function (i) { return isWho(guests[i], pr[0]) || isWho(guests[i], pr[1]); })) hit.push(k); });
        for (var h = 1; h < hit.length; h++) { var a = find(hit[0]), b = find(hit[h]); if (a !== b) par[Math.max(a, b)] = Math.min(a, b); }
      });
      var groups = new Map();
      units.forEach(function (u, k) { var r0 = find(k); if (!groups.has(r0)) groups.set(r0, []); groups.get(r0).push(k); });
      var roots = Array.from(groups.keys()).sort(function (a, b) { return a - b; });
      units = roots.map(function (r0) { var ms = []; groups.get(r0).forEach(function (k) { ms = ms.concat(units[k].ms); }); return { ms: ms }; });
    }
    var seq = [];
    units.forEach(function (u) { u.ms.forEach(function (i, j) { seq.push({ i: i, c: guests[i].cat, s: j === 0 ? u.ms.length : 0 }); }); });
    return seq;
  }

  function refSections(cap, rl, elems) {
    var S = rl.map(function (r) { return [r[0], r[1], r[2], 0, 0]; });
    var sec = 0, size = 0, out = [];
    elems.forEach(function (e) {
      var c = e.c, t = e.s > 0 ? e.s : 1, ok = size + t <= cap;
      var ia = S.map(function (r) { return (r[0] >> c) & 1; }), ib = S.map(function (r) { return (r[1] >> c) & 1; });
      S.forEach(function (r, j) { if ((ia[j] && (r[3] + t > r[2] || r[4] > 0)) || (ib[j] && r[3] > 0)) ok = false; });
      if (!ok) { if (size > 0) sec++; size = 0; S.forEach(function (r) { r[3] = r[4] = 0; }); }
      S.forEach(function (r, j) { r[3] += ia[j]; r[4] += ib[j]; });
      size++; out.push(sec);
    });
    return out;
  }

  // `avoid A B` (Python reference: genome/hero6/lang6.py; verified tag-mask net: genome/hero6/sectioner6.py): A and B name a guest or a company, spaces as _.
  function key(x) { return x === null || x === undefined ? "" : String(x).replace(/[\s,]+/g, "_"); }
  function isWho(g, who) { return key(g.name) === who || key(g.org) === who; }
  function avoidSections(cap, rl, seq, guests, avoids) {
    var S = rl.map(function (r) { return [r[0], r[1], r[2], 0, 0]; }), A = avoids.map(function () { return [false, false]; });
    var sec = 0, size = 0, out = [];
    seq.forEach(function (e, idx) {
      var c = e.c, t = e.s > 0 ? e.s : 1, ok = size + t <= cap;
      var ia = S.map(function (r) { return (r[0] >> c) & 1; }), ib = S.map(function (r) { return (r[1] >> c) & 1; });
      S.forEach(function (r, j) { if ((ia[j] && (r[3] + t > r[2] || r[4] > 0)) || (ib[j] && r[3] > 0)) ok = false; });
      var mem = e.s > 0 ? seq.slice(idx, idx + e.s).map(function (x) { return guests[x.i]; }) : [guests[e.i]];
      avoids.forEach(function (a, j) {
        var ua = mem.some(function (g) { return isWho(g, a[0]); }), ub = mem.some(function (g) { return isWho(g, a[1]); });
        if ((ua && A[j][1]) || (ub && A[j][0])) ok = false;
      });
      if (!ok) { if (size > 0) sec++; size = 0; S.forEach(function (r) { r[3] = r[4] = 0; }); A.forEach(function (x) { x[0] = x[1] = false; }); }
      S.forEach(function (r, j) { r[3] += ia[j]; r[4] += ib[j]; });
      avoids.forEach(function (a, j) { if (isWho(guests[e.i], a[0])) A[j][0] = true; if (isWho(guests[e.i], a[1])) A[j][1] = true; });
      size++; out.push(sec);
    });
    return out;
  }

  // -> {seq: guest indices in seating order, assign: section per guest}
  function seat(guests, p) {
    var seq = prep(guests, p);
    var secs = (p.avoids && p.avoids.length) ? avoidSections(p.cap, rules(p), seq, guests, p.avoids)
      : refSections(p.cap, rules(p), seq.map(function (e) { return { c: e.c, s: e.s }; }));
    var assign = new Array(guests.length);
    seq.forEach(function (e, k) { assign[e.i] = secs[k]; });
    return { seq: seq.map(function (e) { return e.i; }), assign: assign };
  }

  function maxFit(p, c) { var m = p.cap; p.limits.forEach(function (l) { if (l[0].indexOf(c) >= 0) m = Math.min(m, l[1]); }); return m; }

  function violations(guests, p, assign) {
    var n = guests.length, secs = new Map();

          '<p class="fine">A game. The quotes are real public posts; the rest is made up. Not affiliated with anyone at the table. <a href="https://x.com/elonmusk/status/1626516035863212034" target="_blank" rel="noopener">Source</a>, <a href="https://www.cnn.com/2023/06/22/tech/musk-zuckerberg-cage-fight/index.html" target="_blank" rel="noopener">source</a>.</p>';
      }, next: "Scramble the table" },
    { go: function () { st.chat = null; st.rule = null; st.marks = null; if (st.saved) { st.puzzle = st.saved; st.saved = null; relayout(true); fit(); } else if (!st.puzzle) { st.puzzle = newPuzzle(1); lastInc = ""; relayout(true); fit(); } },
      cap: function () {
        var z = st.puzzle;
        if (z.done) return "<h1>" + (z.gaveUp ? "Here’s the program’s answer." : "Apocalypse averted. In this timeline, at least.") + "</h1><p>" + (z.gaveUp ? "No rules broken and no cage match. The next two steps show how it got there, and how a chatbot does with the same job." : "You fixed it in " + z.moves + " swaps and " + Math.max(1, Math.round(z.secs)) + " seconds. Lunch is served, and nobody has mentioned the Octagon. Next, let’s see how a chatbot does.") + "</p>";
        return "<h1>You’re the host</h1><p class=\"rule\">“" + esc(LEVELS[z.lv].sentence) + "”</p><p>Someone has scrambled the seats. Drag a guest onto another seat and the two swap places. Each shaded band is a section of neighbouring seats, and it gets hatched when it breaks the rule. Get the whole table calm before the clock reaches midnight.</p><p><span class=\"keyl\">" + keyLine(z) + "</span></p>";
      }, extra: function () { return st.puzzle && !st.puzzle.done ? '<button class="btn" type="button" id="giveup">Give up</button>' : ""; }, next: "Next" },
    { go: function () { stash(); st.chat = C.show.secs; st.marks = markers(S.parse(LEVELS[1].prog)); relayout(true); fit(); },
      cap: function () { return "<h1>Now ask a chatbot</h1><p>We gave the officials part of that rule to an ordinary small chatbot and asked it 20 times. We spared it the Musk clause.</p><p>Every one of its " + C.n + " answers broke the rule. " + C.dup + " seated someone twice, " + C.miss + " left someone without a seat, and between them there were " + C.distinct + " different seatings for the same question. The chart shows one: " + C.show.miss.length + " guests have no seat, which is one way to avoid arguments.</p>"; }, next: "Next" },
    { go: function () { stash(); setRule(LEVELS[1].prog); st.marks = markers(S.parse(LEVELS[1].prog)); relayout(true); fit(); },
      cap: function () {
        return "<h1>Our tiny AI splits the job in two</h1><p>First, a tiny AI reads the rule. It’s an openly available model, small enough to run on a laptop, that we retrained until it speaks only in a handful of instruction words. It doesn’t seat anyone. For this rule it wrote:</p><span class=\"code\">" + esc(LEVELS[1].prog) + "</span>" +
          "<p>Then a program built from tested building blocks, one per instruction word, does the seating. No rule is broken, and you get the same seating every time you ask. <button class=\"link\" type=\"button\" data-sheet>How it’s built</button></p>" +
          '<p class="fine">The two Musk lines are hand-written for now, while the tiny AI is retrained to read names.</p>';
      }, next: "Next" },
    { go: function () { stash(); setRule(LEVELS[1].prog); relayout(false); resetSea(); goTo(0, 0, 0.02); },
      cap: function () {
        if (sea.mode === "scrambled") return "<h1>Every other timeline</h1><p>Here is the same lunch in thousands of other timelines, each one seated a different way. A heavy black frame means the clock struck midnight at that table. You saved one by hand. These need saving too, and this is where a program earns its keep.</p><p class=\"fine\" id=\"seastat\"></p>";
        if (sea.mode === "fixed") return "<h1>Every timeline saved</h1><p>Every copy is fixed, and every copy ends up with exactly the same seating. However the lunch started, the program finds its way to the same safe ending.</p><p class=\"fine\" id=\"seastat\"></p>";
        return "<h1>The chatbot’s timelines</h1><p>These are the chatbot’s 20 real answers, repeated across the copies. None of them follows the rule, and between them there are 17 different seatings: seventeen different endings, none of them happy.</p><p class=\"fine\" id=\"seastat\"></p>";
      },
      extra: function () { return sea.mode === "fixed" ? '<button class="btn" type="button" id="chatall">Let the chatbot try</button>' : '<button class="btn" type="button" id="fixall">Save every timeline</button>'; }, next: "Next" },
    { go: function () { stash(); setRule(shows[3].emitted, shows[3].gold); relayout(true); fit(); },
      cap: function () { return "<h1>Where it can go wrong</h1><p>The tiny AI isn’t perfect. Given a longer rule, it once squashed four instructions into one and dropped two of them, and the seating program followed those wrong instructions exactly.</p><p>On rules worded by a writer it had never seen, it got about 9 in 10 right. That’s why it always shows you the lines it wrote, so a person can catch a misreading before anyone sits down.</p>"; }, next: "Your turn" }
  ];

  function paint() {
    var html, bar;
    if (mode === "story") {
      var c = CH[chap], dots = "";
      for (var i = 0; i < CH.length; i++) dots += '<i class="' + (i === chap ? "on" : "") + '"></i>';
      html = c.cap();
      bar = '<div class="bar"><button class="link" type="button" id="back"' + (chap ? "" : " hidden") + '>Back</button><span class="dots" role="img" aria-label="Step ' + (chap + 1) + " of " + CH.length + '">' + dots + '</span><span class="sp"></span>' + (c.extra ? c.extra() : "") + '<button class="btn primary" type="button" id="next">' + c.next + "</button></div>";
    } else {
      var z = st.puzzle;
      html = z.done ? "<h1>" + (z.gaveUp ? "The program’s answer" : "Apocalypse averted.") + "</h1><p>" + (z.gaveUp ? "No rules broken. Try another level, or scramble this one again and beat it yourself." : "You fixed it in " + z.moves + " swaps and " + Math.max(1, Math.round(z.secs)) + " seconds. Lunch is served. Try a harder level, or save every other timeline at once.") + "</p>"
        : "<h1>Your turn</h1><p class=\"rule\">“" + esc(LEVELS[z.lv].sentence) + "”</p><p>Drag guests to swap seats until no section is hatched. Pick a level below; Hard adds a rule about keeping colleagues together.</p><p><span class=\"keyl\">" + keyLine(z) + "</span></p>";
      bar = '<div class="bar"><span class="chips">' + LEVELS.map(function (L, i) { return '<button class="btn small chip" type="button" data-lv="' + i + '" aria-pressed="' + (i === z.lv) + '">' + L.name + "</button>"; }).join("") + '</span><span class="sp"></span>' +
        (z.done ? '<button class="btn primary" type="button" id="again">New scramble</button>' : '<button class="btn" type="button" id="giveup">Give up</button>') + "</div>" +
        '<div class="links"><button class="link" type="button" id="thousands">Save every timeline</button><button class="link" type="button" data-sheet>How it works</button><button class="link" type="button" id="replay">Watch the story again</button></div>';
    }
    capEl.innerHTML = '<div class="cap-in">' + html + "</div>" + bar;
    bind();
    live();
  }
  function bind() {
    var q = function (id) { return document.getElementById(id); };
    if (q("next")) q("next").onclick = function () { if (chap === CH.length - 1) play(); else story(chap + 1); };
    if (q("back")) q("back").onclick = function () { story(chap - 1); };
    if (q("giveup")) q("giveup").onclick = letAI;
    if (q("again")) q("again").onclick = function () { startPuzzle(st.puzzle.lv); };
    if (q("fixall")) q("fixall").onclick = function () { wave("fixed"); };
    if (q("chatall")) q("chatall").onclick = function () { wave("chat"); };
    if (q("replay")) q("replay").onclick = function () { story(0); };
    if (q("thousands")) q("thousands").onclick = function () { goTo(0, 0, 0.02); setTimeout(function () { wave("fixed"); }, reduce ? 0 : 900); };
    Array.prototype.forEach.call(capEl.querySelectorAll("[data-lv]"), function (b) { b.onclick = function () { startPuzzle(+b.dataset.lv); }; });
    Array.prototype.forEach.call(capEl.querySelectorAll("[data-sheet]"), function (b) { b.onclick = openSheet; });
  }
  function panel() { paint(); fitSoon(); }
  var fitT = 0;
  function fitSoon() { clearTimeout(fitT); fitT = setTimeout(function () { if (!camAnim && (mode !== "story" || chap !== 4)) fit(); }, 30); }
  function story(i) { mode = "story"; chap = Math.max(0, Math.min(CH.length - 1, i)); sheet.hidden = true; CH[chap].go(); paint(); fitSoon(); }
  function play() { mode = "play"; st.chat = null; st.rule = null; st.marks = null; if (!st.puzzle) { st.puzzle = st.saved || newPuzzle(0); st.saved = null; } resetSea(); relayout(true); paint(); fitSoon(); }
  function openSheet() { sheet.hidden = false; document.getElementById("sheetbody").innerHTML = aboutHTML(); sheet.scrollTop = 0; document.getElementById("sheetclose").focus(); }
  document.getElementById("sheetclose").onclick = function () { sheet.hidden = true; };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") sheet.hidden = true; });
  var QUOTES = [["Elon Musk on OpenAI", "Not what I intended at all."], ["Elon Musk on Zuckerberg", "I’m up for a cage match if he is."], ["Mark Zuckerberg’s reply", "Send Me Location."]];
  function quoteToasts() { QUOTES.forEach(function (q, i) { setTimeout(function () { if (mode === "story" && chap === 0) toast(q[0] + ": “" + q[1] + "”"); }, 600 + i * 2600); }); }
  var ABOUT = '<div class="pane"><p class="kicker">How it works</p><h1>What we built, and why</h1>' +
      "<p>Computers follow exact instructions. People describe rules in everyday words, usually over lunch. The small chatbots we tested went straight from the words to a seating, and slipped. We put a tiny AI in the middle that only translates, and let a checked program do the rest.</p>" +
      '<div class="flow"><div class="box"><b>Your rule, in plain words</b><span>“No two government officials in one section.”</span></div><div class="arrow">↓</div>' +
      '<div class="box hi"><b>Tiny AI: translate</b><span>A small model that runs on a laptop. About 1 second, one to four short lines out.</span></div><div class="arrow">↓</div>' +
      '<div class="box"><b>Instruction</b><span class="code">limit government 1</span><span>Five instruction words (size, together, limit, apart, order) cover every rule on this page.</span></div><div class="arrow">↓</div>' +
      '<div class="box hi"><b>Tested seating program (no AI): seat and check</b><span>No AI in this step. The part that splits guests into sections was tested against thousands of cases. Same answer every time.</span></div><div class="arrow">↓</div>' +
      '<div class="box"><b>The seating, and a count of broken rules</b><span>If the AI misreads, you can see the instruction and catch it.</span></div></div>' +
      "<h2>How it’s built</h2><p><b>The tiny AI</b> is an openly available small model that we retrained on 9,000 example rules, each paired with the right instructions. It learned one narrow skill: turning a sentence into those instructions.</p><p><b>The building blocks</b> are small programs, one per instruction word. The seating program is simply the blocks the AI picked, snapped together in order.</p><svg class=\"fig\" viewBox=\"0 0 300 232\" role=\"img\" aria-label=\"The instruction words as building blocks stacked between guests in and seating out\"><text x=\"150\" y=\"14\" text-anchor=\"middle\" class=\"t\">guests in</text><path d=\"M150 20 V38\" class=\"w\"/><rect x=\"40\" y=\"40\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"65\" text-anchor=\"middle\" class=\"m\">together company</text><path d=\"M150 80 V98\" class=\"w\"/><rect x=\"40\" y=\"100\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"125\" text-anchor=\"middle\" class=\"m\">limit government 1</text><path d=\"M150 140 V158\" class=\"w\"/><rect x=\"40\" y=\"160\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"185\" text-anchor=\"middle\" class=\"m\">size 4</text><path d=\"M150 200 V218\" class=\"w\"/><text x=\"150\" y=\"231\" text-anchor=\"middle\" class=\"t\">seating out</text></svg><p class=\"fine\">The Hard puzzle’s rule as three blocks. Every block was tested on its own before use, including every possible case on small tables.</p><p><b>The code the blocks are written in</b> is unusual. It’s called an interaction net. Instead of lines of text, a program is a wiring diagram, and the computer runs it by rewriting pairs of connected pieces, over and over, until nothing is left to rewrite.</p><svg class=\"fig\" viewBox=\"0 0 300 96\" role=\"img\" aria-label=\"Two connected pieces meet and are replaced by a direct wire\"><path d=\"M10 30 H48 M10 66 H48\" class=\"w\"/><polygon points=\"48,22 48,74 88,48\" class=\"n\"/><path d=\"M88 48 H112\" class=\"w a\"/><polygon points=\"152,22 152,74 112,48\" class=\"n\"/><path d=\"M152 30 H176 M152 66 H176\" class=\"w\"/><text x=\"196\" y=\"53\" class=\"t\">→</text><path d=\"M214 30 C250 30 250 30 290 30 M214 66 C250 66 250 66 290 66\" class=\"w\"/></svg><p class=\"fine\">One rewrite step: two pieces joined head to head disappear, and their wires connect directly.</p><p>Every step is small and happens in one spot, so programs are easy to test and to snap together.</p><p><b>Why it matters.</b> The pattern fits any job made of rules: a tiny AI that only picks from tested blocks, and a program you can read. We first built it for tidying lists of people and companies, like merging duplicate contacts.</p>" +
      "<h2>The numbers</h2>" +
      '<div class="bars"><div class="lab"><span>Chatbot: answers that seat everyone once and follow the rule</span><span>0 of 400</span></div><div class="track"><div class="fill" style="width:0%"></div></div>' +
      '<div class="lab"><span>Tiny AI + seating program: answers that seat everyone once and follow the rule</span><span>400 of 400</span></div><div class="track"><div class="fill" style="width:100%"></div></div>' +
      '<p class="fine">The same 20 rules, 20 tries each. The chatbot is an ordinary small model on the same laptop, about twice the size of our tiny AI. We did not test the big online chatbots.</p></div>' +
      '<div class="facts"><div class="fact"><b>9 in 10</b><span>test rules worded by a separate AI writer, read correctly (326 of 360)</span></div>' +
      '<div class="fact"><b>1 answer</b><span>per rule, every time; the chatbot gave about 18 different ones</span></div>' +
      '<div class="fact"><b>~1 second</b><span>for the tiny AI to write an instruction</span></div>' +
      '<div class="fact"><b>100,000</b><span>made-up guests seated with no broken rules in 1.5 to 3 seconds, not counting setup</span></div></div>' +
      "<h2>How we got here</h2><p>This began as a research question: can AI write programs in a new kind of code made for machines, closer to a wiring diagram than to words?</p><ul>" +
      "<li><b>AI can write it.</b> Off-the-shelf models wrote working programs for 176 of 200 test problems we wrote; each was checked by running it on test cases.</li>" +
      "" +
      "<li><b>Mistakes were in the planning, not the details.</b> So we built checked building blocks and let the AI choose and combine them.</li>" +
      "<li><b>That made a tiny AI work.</b> Writing whole programs, a small AI got about 1 in 7 tasks right. Choosing from checked building blocks, it got nearly all right when the wording was familiar, and 4 to 8 in 10 when it wasn’t.</li></ul>" +
      "<h2>What runs on this page</h2><p>The seating program runs live in your browser. It is a JavaScript copy of our checked program, tested to give identical answers on 400 random cases and every recorded example.</p><p>The tiny AI does not run in your browser. Its readings of these sentences were recorded on a laptop beforehand. The chatbot’s answers are its real answers from our test. The avoid word (for Musk and friends) is new: we wrote those lines by hand, and it is tested on this page but not yet part of our checked blocks.</p>";
  function aboutHTML() { return ABOUT + "</div>"; }
  // ---------- loop
  var liveT = 0;
  function frameLoop(now) {
    if (camAnim) {
      var p = Math.min(1, (now - camAnim.t0) / camAnim.dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      cam.x = camAnim.a.x + (camAnim.b.x - camAnim.a.x) * e; cam.y = camAnim.a.y + (camAnim.b.y - camAnim.a.y) * e; cam.s = Math.exp(camAnim.a.ls + (camAnim.b.ls - camAnim.a.ls) * e);
      dirty = true; if (p >= 1) camAnim = null;
    }
    if (stepAnim(now)) dirty = true;
    if (stepWave(now)) dirty = true;
    if (dirty) { dirty = false; render(now); }
    if (now - liveT > 250) { liveT = now; live(); }
    requestAnimationFrame(frameLoop);
  }
  window.addEventListener("resize", function () { resize(); fitSoon(); });
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('italic 500 17px "Cormorant Garamond"'), document.fonts.load('600 23px "Cormorant Garamond"'), document.fonts.load('12px "Source Serif 4"')]).then(function () { dirty = true; }, function () {});
  resize(); cam.s = fitScale();
  relayout(false); story(0);
  requestAnimationFrame(frameLoop);
  window.__luncheon = { st: st, sea: sea, cam: cam, story: story, play: play, swap: swapSeats, letAI: letAI, wave: wave, stepWave: stepWave,
    render: function () { render(performance.now()); }, sheet: openSheet };
})();
