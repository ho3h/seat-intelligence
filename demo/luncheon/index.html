<style>
  /* Monotone state-dinner stationery: black ink on white card, engraved serif display, a book serif for reading. One caption card over a full-screen chart. Deliberately single-theme. */
  :root { --ink:#151515; --mute:#6b6b68; --paper:#fbfbf9; --soft:#efeeea; --hair:#d6d4ce; --bad:#a8322a; --red:#a8322a; --good:#151515; --blue:#151515;
          --display:"Cormorant Garamond", "EB Garamond", Georgia, serif; --text:"Source Serif 4", Georgia, "Times New Roman", serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); }
  body { font:15.5px/1.55 var(--text); overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  #stage.drag { cursor:grabbing; }
  #stage.can-pick { cursor:pointer; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  button { font:inherit; color:inherit; }
  .btn { background:var(--paper); border:1px solid var(--ink); padding:6px 16px; cursor:pointer; border-radius:0; white-space:nowrap; font-family:var(--text); font-size:14.5px; letter-spacing:.02em; }
  .btn:hover { background:var(--soft); }
  .btn.primary { font-variant:small-caps; letter-spacing:.08em; font-size:16px; }
  .btn.primary { background:var(--ink); color:#fff; }
  .btn.primary:hover { background:#333; }
  .btn.small { padding:3px 10px; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .link { background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; cursor:pointer; font-size:14px; font-family:var(--text); }
  a { color:var(--ink); text-underline-offset:3px; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .nav { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); left:14px; display:flex; flex-direction:column; gap:6px; }
  @media (max-width:1020px) { .nav { display:none; } }
  /* the caption card */
  #cap { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:min(560px, calc(100% - 24px));
         background:var(--paper); border:1px solid var(--ink); box-shadow:0 1px 0 var(--ink), 0 10px 30px rgba(0,0,0,.08); }
  .cap-in { padding:12px 16px 4px; max-height:32vh; overflow:auto; }

  .rule { font:italic 600 21px/1.25 var(--display); margin:0 0 8px !important; }
  .keyl { color:var(--mute); font-size:14px; white-space:nowrap; }

  /* p(doom) lives in the frame: a small card with one number and a hairline meter */
  .hud { position:absolute; top:calc(12px + env(safe-area-inset-top, 0px)); right:12px; background:var(--paper); color:var(--ink); border:1px solid var(--hair); padding:8px 12px 7px; min-width:150px; }
  .hud b { display:block; font:italic 600 22px/1.05 var(--display); font-variant-numeric:lining-nums tabular-nums; }

  .hud .pbar i { display:block; height:3px; width:0; background:var(--ink); transition:width .5s ease; }
  .hud #hudred { display:block; font-size:11.5px; color:var(--mute); }

  @keyframes strike { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .capclock { display:none; padding:7px 12px 6px; border-bottom:1px solid var(--hair); font-size:12px; color:var(--mute); }
  .capclock b { font:italic 600 16px/1.2 var(--display); color:var(--ink); margin-right:6px; }
  .capclock.late b { color:var(--red); }
  .over { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; background:rgba(251,251,249,.55); }
  .over-in { background:var(--paper); border:1px solid var(--ink); border-top:4px solid var(--red); padding:22px 26px 20px; max-width:min(440px, calc(100% - 32px)); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  .over .pd { font:italic 600 52px/1 var(--display); color:var(--red); margin:0 0 10px; }
  .over p { margin:0 0 14px; }
  .over .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .kick { margin:0 0 4px !important; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); }
  .lede { font:italic 500 20px/1.3 var(--display); margin:0 0 8px !important; }
  /* social card mode (#card 1200x630 link preview, #card-sq 1080x1350 feed post): the live UI, zoomed in, nothing added but a header and the name */

  .toast { position:absolute; top:calc(62px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); width:max-content; max-width:min(520px, calc(100vw - 32px)); background:var(--ink); color:#fff; padding:10px 18px; font:italic 500 19px/1.3 var(--display); pointer-events:none; opacity:0; transition:opacity .25s; text-align:center; }
  .toast.on { opacity:1; }
  /* How it works */
  #sheet { position:fixed; inset:0; background:rgba(17,17,17,.35); overflow:auto; }
  .sheet-in { background:var(--paper); max-width:640px; margin:calc(24px + env(safe-area-inset-top, 0px)) auto 24px; border:1px solid var(--ink); position:relative; }
  #sheetclose { position:sticky; top:0; float:right; margin:10px; }
  .pane { padding:18px 22px 22px; }
  .kicker { margin:0 0 6px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .pane h1 { margin:0 0 10px; font:600 32px/1.1 var(--display); text-wrap:balance; }
  .pane h2 { margin:24px 0 8px; font:600 23px/1.2 var(--display); }
  .pane p { margin:0 0 10px; }
  .flow { margin:6px 0 14px; }
  .flow .box { border:1px solid var(--ink); padding:8px 10px; }
  .flow .box b { display:block; }
  .flow .box span { font-size:13.5px; color:var(--mute); }
  .flow .box.hi { background:var(--soft); }
  .flow .arrow { text-align:center; line-height:1; padding:3px 0; color:var(--mute); }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 12px; }
  .fact { border:1px solid var(--ink); padding:8px 10px; min-width:0; }
  .fact b { display:block; font:600 30px/1.05 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .fact span { font-size:13.5px; color:var(--mute); }
  .bars { margin:6px 0 14px; }
  .bars .lab { font-size:14px; margin:6px 0 2px; display:flex; justify-content:space-between; gap:10px; }
  .bars .track { height:10px; background:var(--soft); border:1px solid var(--hair); }
  .bars .fill { height:8px; background:var(--ink); }
  .fig { display:block; width:100%; max-width:320px; height:auto; margin:6px 0 4px; }
  .fig .b { fill:var(--soft); stroke:var(--ink); stroke-width:1.5; }
  .fig .n { fill:var(--paper); stroke:var(--ink); stroke-width:1.8; }
  .fig .w { fill:none; stroke:var(--ink); stroke-width:1.8; }
  .fig .a { stroke:var(--blue); stroke-width:3; }
  .fig .t { fill:var(--mute); font-size:13px; font-family:inherit; }
  .fig .m { fill:var(--ink); font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pane ul { margin:0 0 10px; padding-left:18px; }
  .pane li { margin:0 0 6px; }
  @media (max-width:600px) {
    .hud { display:none !important; }
    .capclock { display:block; }
    .cap-in { padding:10px 12px 2px; max-height:24vh; }
    .cap-in h1 { font-size:24px; }
    .rule { font-size:18px; }
    .bar { padding:6px 12px 10px; }
    .links { padding:0 12px 10px; gap:12px; }
    .hud { padding:6px 10px 6px 6px; gap:8px; }
    .hud svg { width:40px; height:40px; }
    .hud b { font-size:17px; }
    .nav { display:none; }
    .facts { grid-template-columns:1fr; }

  @media (prefers-reduced-motion: reduce) { .toast, .hud .hand { transition:none; } .hud.strike { animation:none; } }

  /* type, third pass: Libre Caslon for the chart, place cards and quotes; Source Serif for reading; Courier Prime for the official numbers */
  :root { --display:"Libre Caslon Text", Georgia, serif; --mono:"Courier Prime", "Courier New", monospace; }
  .cap-in h1 { font:600 22px/1.25 var(--text); letter-spacing:0; }
  .lede { font:italic 400 18px/1.35 var(--display); }
  .rule { font:italic 400 17px/1.4 var(--display); }
  .btn.primary { font-variant:normal; letter-spacing:.01em; font-size:15px; }
  .hud b { font:700 21px/1.1 var(--mono); }
  .hud #hudred { font:12px/1.3 var(--mono); }
  .capclock b { font:700 15px/1.2 var(--mono); }
  .code { font-family:var(--mono); }
  .toast { font:italic 400 16.5px/1.35 var(--display); }
  .over .pd { font:700 46px/1 var(--mono); }
  .lvname { font:italic 400 17px/1.1 var(--display); }
  .pane h1 { font:600 26px/1.2 var(--text); }
  .pane h2 { font:600 19px/1.3 var(--text); }
  .kicker { letter-spacing:0; text-transform:none; font-size:13px; }
  .fact b { font:700 26px/1.1 var(--mono); }

  /* long captions: grow to fit, and when they still overflow, fade the bottom and say so */
  .cap-in { max-height:40vh; position:relative; }
  .cap-in.more { -webkit-mask-image:linear-gradient(to bottom, #000 78%, transparent); mask-image:linear-gradient(to bottom, #000 78%, transparent); }
  .morehint { display:none; position:absolute; left:50%; transform:translateX(-50%); margin-top:-30px; font:13px var(--text); background:var(--ink); color:#fff; padding:3px 10px; pointer-events:none; }
  #cap.has-more .morehint { display:block; }
  @media (max-width:600px) { .cap-in { max-height:50vh; } }

  /* desktop: copy in a left-hand column, the chart in the right-hand side */
  @media (min-width:900px) {
    #cap { left:0; top:0; bottom:0; transform:none; width:min(42vw, 540px); border:0; border-right:1px solid var(--ink); box-shadow:none; display:flex; flex-direction:column; }
    .cap-in { max-height:none; flex:1 1 auto; overflow:auto; padding:13vh 44px 16px; }
    .cap-in h1 { font-size:27px; }
    .cap-in p { font-size:16.5px; }
    .rule, .lede { font-size:19px; }
    .bar { padding:14px 44px 26px; border-top:1px solid #e3e1db; }
    .links { padding:0 44px 26px; }
    .capclock { padding:12px 44px 10px; }
    .morehint { margin-top:-34px; }
    .nav { left:auto; right:14px; }
    .toast { left:calc(min(42vw, 540px) + (100vw - min(42vw, 540px)) / 2); }
  }

  /* made-by credit, bottom right of the chart on desktop; inside the How it works sheet on phones */
  .credit { position:absolute; right:14px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); font:13px/1.2 var(--text); color:var(--mute); display:flex; gap:10px; align-items:baseline; background:rgba(251,251,249,.9); padding:4px 6px; }
  .credit a { color:var(--ink); }
  @media (min-width:900px) { .nav { bottom:calc(46px + env(safe-area-inset-bottom, 0px)); } }
  @media (max-width:899px) { .credit { display:none; } }
  body.card .credit { display:none !important; }

  .capfoot { margin:0; padding:0 16px 12px; color:var(--mute); font-size:12.5px; line-height:1.5; }
  @media (min-width:900px) {
    .cap-in { padding:15vh 52px 20px; }
    .cap-in h1 { font-size:30px; line-height:1.2; margin-bottom:14px; }
    .lede { margin-bottom:26px !important; font-size:20px; }
    .cap-in p { font-size:17px; line-height:1.65; margin-bottom:18px; }
    .rule { margin-bottom:18px !important; }
    .bar { padding:16px 52px 22px; }
    .links { padding:0 52px 24px; }
    .capfoot { padding:0 52px 26px; font-size:13px; }
    #cap { width:min(44vw, 580px); }
    .toast { left:calc(min(44vw, 580px) + (100vw - min(44vw, 580px)) / 2); }
  }

  /* p(doom): bigger, and a short red pulse whenever a move raises it */
  .hud { min-width:170px; }
  .hud b { font-size:26px; display:inline-block; }
  .hud .delta { display:inline-block; margin-left:8px; font:700 15px var(--mono); color:var(--red); vertical-align:3px; }
  .hud.up { animation:pd-up 1.1s ease-out; }
  .hud.down .delta { color:var(--mute); }
  .capclock.up { animation:pd-up 1.1s ease-out; }
  .capclock .delta { margin:0 6px 0 2px; font:700 13px var(--mono); color:var(--red); }
  .capclock.down .delta, .hud.tick .delta, .capclock.tick .delta { color:var(--mute); }
  @keyframes pd-up { 0% { background:var(--red); color:#fff; border-color:var(--red); } 100% { background:var(--paper); } }
  @media (prefers-reduced-motion: reduce) { .hud.up, .capclock.up { animation:none; outline:2px solid var(--red); } }

  /* p(doom) past 1: the meter overcharges. It wobbles, the bar runs with stripes and bubbles fizz off the top */
  .hud .pbar { position:relative; }
  .hud .fizz { display:none; position:absolute; left:0; right:0; top:0; height:0; }
  .hud.boil .fizz { display:block; }
  .hud .fizz i { position:absolute; top:-2px; width:5px; height:5px; border:1.5px solid var(--red); border-radius:50%; opacity:0; animation:fizz 1.1s ease-out infinite; }
  .hud .fizz i:nth-child(1) { left:16%; }
  .hud .fizz i:nth-child(2) { left:43%; width:4px; height:4px; animation-delay:.3s; }
  .hud .fizz i:nth-child(3) { left:66%; animation-delay:.62s; }
  .hud .fizz i:nth-child(4) { left:88%; width:3px; height:3px; animation-delay:.86s; }
  @keyframes fizz { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; } 100% { transform:translateY(-15px); opacity:0; } }
  .hud.boil { border-color:var(--red); transform-origin:50% 0; animation:wobble .3s ease-in-out infinite alternate; }
  .hud.boil.up { animation:pd-up 1.1s ease-out, wobble .3s ease-in-out infinite alternate; }
  .hud.boil .pbar i { background:repeating-linear-gradient(-45deg, var(--red) 0 5px, #cf6a61 5px 10px); background-size:14.14px 14.14px; animation:charge .5s linear infinite; }
  .capclock.boil b { display:inline-block; color:var(--red); animation:wobble .3s ease-in-out infinite alternate; }
  @keyframes wobble { from { transform:rotate(calc(-1 * var(--amp, 1deg))); } to { transform:rotate(var(--amp, 1deg)); } }
  @keyframes charge { to { background-position:14.14px 0; } }
  @media (prefers-reduced-motion: reduce) { .hud.boil, .hud.boil.up, .capclock.boil b, .hud .fizz i, .hud.boil .pbar i { animation:none; } }
</style>

<div id="stage">
  <canvas id="cv" role="img" aria-label="Seating chart of the White House AI lunch"></canvas>
  <div class="nav"><button class="btn small" id="fit" type="button">Lunch table</button><button class="btn small" id="far" type="button">Zoom out</button></div>

  <div class="over" id="over" hidden role="alertdialog" aria-label="Game over"><div class="over-in"><p class="pd">p(doom) = 1</p><p>The AI apocalypse began somewhere between the soup and the main course.</p><div class="row"><button class="btn primary" type="button" id="retry">Try again</button><button class="btn" type="button" id="showai">Show me the program’s answer</button></div></div></div>

  <nav class="credit" aria-label="Made by">by Theo Hopkinson <a href="https://github.com/ho3h" target="_blank" rel="noopener">GitHub</a><a href="https://www.linkedin.com/in/theohopkinson/" target="_blank" rel="noopener">LinkedIn</a><a href="https://x.com/theohopkinson" target="_blank" rel="noopener">X</a></nav>
  <div id="cardpd" hidden><b>p(doom)</b><span>1.10</span><i></i></div><div id="cardtext" hidden></div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="How it works"><div class="sheet-in"><button class="btn small" type="button" id="sheetclose">Close</button><div id="sheetbody"></div></div></div>
<script>
// Seating function for the luncheon page. A line-for-line port of genome/hero1/lang.py
// (parse, prep, ref_sections, violations, posted_assignment) and of the HERO-6 named words
// `avoid` and `pair` (genome/hero6/lang6.py). Checked against the Python reference by
// test_seating.js; the Python reference is itself checked against the verified net.
var Seating = (function () {
  var CATS = ["ai_lab", "big_tech", "chips", "software_security", "investor", "government", "unlabelled"];
  var CID = {}; CATS.forEach(function (c, i) { CID[c] = i; });
  var INF = (1 << 24) - 1, MAXCAP = 6;

      extra: function () { return sea.mode === "fixed" ? '<button class="btn" type="button" id="chatall">Let the chatbot try</button>' : '<button class="btn" type="button" id="fixall">Let the tiny AI try</button>'; }, next: "Next" },
    { go: function () { stash(); var r = H6[shows[3].sentence] || { program: shows[3].emitted, intended: shows[3].gold }; setRule(r.program, r.intended); relayout(true); fit(); },
      cap: function () { var r = H6[shows[3].sentence] || { program: shows[3].emitted, intended: shows[3].gold };
        return "<h1>Where it can go wrong</h1><p>The tiny AI isn’t perfect. Given this longer rule:</p><p class=\"rule\">“" + esc(shows[3].sentence) + "”</p><p>it wrote</p><span class=\"code\">" + esc(r.program) + "</span><p>which mangles the officials part and drops “colleagues together” and “investors first”. The seating program then followed those wrong instructions exactly.</p>" +
          "<p>On rules worded by a writer it had never seen, it gets about 9 in 10 right. It can also trip on a surname it has never met: mention “Su” and it may invent a guest nobody is called, so the rule quietly does nothing. That’s why it always shows you the lines it wrote, so a person can catch a misreading before anyone sits down.</p>"; }, next: "Your turn" }
  ];

        : "<h1>Your turn</h1><p class=\"rule\">“" + esc(LEVELS[z.lv].sentence) + "”</p>" + (LEVELS[z.lv].note ? "<p class=\"fine\">" + esc(LEVELS[z.lv].note) + "</p>" : "") + "<p>Drag guests to swap seats and clear every clash, the red names joined by red lines. Any clash sends p(doom) past 1; clear them all to bring it to zero. Use the arrows for another rule; there are seven, each written in plain English and read by the tiny AI.</p><p><span class=\"keyl\">" + keyLine(z) + "</span></p>";
      bar = '<div class="bar"><span class="stepper"><button class="btn small" type="button" data-lv="' + ((z.lv + LEVELS.length - 1) % LEVELS.length) + '" aria-label="Previous rule">\u2039</button><span class="lvname">' + esc(LEVELS[z.lv].name) + ' <span class="fine">' + (z.lv + 1) + ' of ' + LEVELS.length + '</span></span><button class="btn small" type="button" data-lv="' + ((z.lv + 1) % LEVELS.length) + '" aria-label="Next rule">\u203a</button></span><span class="sp"></span>' +
        (z.done || z.over ? '<button class="btn primary" type="button" id="again">' + (z.over ? 'Try again' : 'New scramble') + '</button>' : '<button class="btn" type="button" id="giveup">Give up</button>') + "</div>" +
        '<div class="links"><button class="link" type="button" id="thousands">Let the tiny AI save the other timelines</button><button class="link" type="button" data-sheet>How it works</button><button class="link" type="button" id="replay">Watch the story again</button></div>';
    }

    capEl.innerHTML = clockLine + '<div class="cap-in">' + html + '</div><div class="morehint" aria-hidden="true">More \u2193</div>' + bar + footer;
    var ci = capEl.querySelector(".cap-in"), check = function () { var more = ci.scrollHeight - ci.scrollTop - ci.clientHeight > 6; ci.classList.toggle("more", more); capEl.classList.toggle("has-more", more); };
    ci.addEventListener("scroll", check); setTimeout(check, 0); setTimeout(check, 400);
    bind();
    live();

  function panel() { paint(); fitSoon(); }
  var fitT = 0;

  function story(i) { mode = "story"; chap = Math.max(0, Math.min(CH.length - 1, i)); sheet.hidden = true; CH[chap].go(); paint(); fitSoon(); }
  function play() { mode = "play"; st.chat = null; st.rule = null; st.marks = null; if (!st.puzzle) { st.puzzle = st.saved || newPuzzle(0); st.saved = null; } resetSea(); relayout(true); paint(); fitSoon(); }

  document.getElementById("sheetclose").onclick = function () { sheet.hidden = true; };

  var QUOTES = [["Elon Musk on Zuckerberg", "I’m up for a cage match if he is."], ["Mark Zuckerberg’s reply", "Send Me Location."]];
  function quoteToasts() { QUOTES.forEach(function (q, i) { setTimeout(function () { if (mode === "story" && chap === 0) toast(q[0] + ": “" + q[1] + "”"); }, 600 + i * 2600); }); }
  var ABOUT = '<div class="pane"><p class="kicker">Seat Intelligence (SI) \u00b7 How it works</p><h1>What we built, and why</h1><p class="fine">A game. The quotes are real public posts; the rest is made up. Not affiliated with anyone at the table.</p>' +
      "<p>Computers follow exact instructions. People describe rules in everyday words, usually over lunch. The small chatbots we tested went straight from the words to a seating, and slipped. We put a tiny AI in the middle that only translates, and let a checked program do the rest.</p>" +
      '<div class="flow"><div class="box"><b>Your rule, in plain words</b><span>“No two government officials in one section.”</span></div><div class="arrow">↓</div>' +
      '<div class="box hi"><b>Tiny AI: translate</b><span>A small model that runs on a laptop. Under half a second, one to four short lines out.</span></div><div class="arrow">↓</div>' +
      '<div class="box"><b>Instruction</b><span class="code">limit government 1</span><span>Seven instruction words (size, together, limit, apart, order, and two for named guests: avoid and pair) cover every rule on this page.</span></div><div class="arrow">↓</div>' +
      '<div class="box hi"><b>Tested seating program (no AI): seat and check</b><span>No AI in this step. The part that splits guests into sections was tested against thousands of cases. Same answer every time.</span></div><div class="arrow">↓</div>' +
      '<div class="box"><b>The seating, and a count of broken rules</b><span>If the AI misreads, you can see the instruction and catch it.</span></div></div>' +
      "<h2>How it’s built</h2><p><b>The tiny AI</b> is an openly available small model that we retrained on 9,000 example rules, each paired with the right instructions. It learned one narrow skill: turning a sentence into those instructions.</p><p><b>The building blocks</b> are small programs, one per instruction word. The seating program is simply the blocks the AI picked, snapped together in order.</p><svg class=\"fig\" viewBox=\"0 0 300 232\" role=\"img\" aria-label=\"The instruction words as building blocks stacked between guests in and seating out\"><text x=\"150\" y=\"14\" text-anchor=\"middle\" class=\"t\">guests in</text><path d=\"M150 20 V38\" class=\"w\"/><rect x=\"40\" y=\"40\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"65\" text-anchor=\"middle\" class=\"m\">together company</text><path d=\"M150 80 V98\" class=\"w\"/><rect x=\"40\" y=\"100\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"125\" text-anchor=\"middle\" class=\"m\">limit government 1</text><path d=\"M150 140 V158\" class=\"w\"/><rect x=\"40\" y=\"160\" width=\"220\" height=\"40\" class=\"b\"/><text x=\"150\" y=\"185\" text-anchor=\"middle\" class=\"m\">size 4</text><path d=\"M150 200 V218\" class=\"w\"/><text x=\"150\" y=\"231\" text-anchor=\"middle\" class=\"t\">seating out</text></svg><p class=\"fine\">The Hard puzzle’s rule as three blocks. Every block was tested on its own before use, including every possible case on small tables.</p><p><b>The code the blocks are written in</b> is unusual. It’s called an interaction net. Instead of lines of text, a program is a wiring diagram, and the computer runs it by rewriting pairs of connected pieces, over and over, until nothing is left to rewrite.</p><svg class=\"fig\" viewBox=\"0 0 300 96\" role=\"img\" aria-label=\"Two connected pieces meet and are replaced by a direct wire\"><path d=\"M10 30 H48 M10 66 H48\" class=\"w\"/><polygon points=\"48,22 48,74 88,48\" class=\"n\"/><path d=\"M88 48 H112\" class=\"w a\"/><polygon points=\"152,22 152,74 112,48\" class=\"n\"/><path d=\"M152 30 H176 M152 66 H176\" class=\"w\"/><text x=\"196\" y=\"53\" class=\"t\">→</text><path d=\"M214 30 C250 30 250 30 290 30 M214 66 C250 66 250 66 290 66\" class=\"w\"/></svg><p class=\"fine\">One rewrite step: two pieces joined head to head disappear, and their wires connect directly.</p><p>Every step is small and happens in one spot, so programs are easy to test and to snap together.</p><p><b>Why it matters.</b> The pattern fits any job made of rules: a tiny AI that only picks from tested blocks, and a program you can read. We first built it for tidying lists of people and companies, like merging duplicate contacts.</p>" +
      "<h2>The numbers</h2>" +
      '<div class="bars"><div class="lab"><span>Chatbot: answers that seat everyone once and follow the rule</span><span>0 of 400</span></div><div class="track"><div class="fill" style="width:0%"></div></div>' +
      '<div class="lab"><span>Tiny AI + seating program: answers that seat everyone once and follow the rule</span><span>400 of 400</span></div><div class="track"><div class="fill" style="width:100%"></div></div>' +
      '<p class="fine">The same 20 rules, 20 tries each, measured with the first version of the tiny AI, before it learned names. The chatbot is an ordinary small model on the same laptop, about twice the size of our tiny AI. We did not test the big online chatbots.</p></div>' +
      '<div class="facts"><div class="fact"><b>9 in 10</b><span>rules naming guests, worded by a separate AI writer, read correctly (321 of 360)</span></div>' +
      '<div class="fact"><b>1 answer</b><span>per rule, every time; the chatbot gave about 18 different ones</span></div>' +
      '<div class="fact"><b>&lt;0.5 s</b><span>for the tiny AI to write its instructions</span></div>' +
      '<div class="fact"><b>100,000</b><span>made-up guests seated with no broken rules in 1.5 to 3 seconds, not counting setup</span></div></div>' +
      "<h2>How we got here</h2><p>This began as a research question: can AI write programs in a new kind of code made for machines, closer to a wiring diagram than to words?</p><ul>" +
      "<li><b>AI can write it.</b> Off-the-shelf models wrote working programs for 176 of 200 test problems we wrote; each was checked by running it on test cases.</li>" +
      "" +
      "<li><b>Mistakes were in the planning, not the details.</b> So we built checked building blocks and let the AI choose and combine them.</li>" +
      "<li><b>That made a tiny AI work.</b> Writing whole programs, a small AI got about 1 in 7 tasks right. Choosing from checked building blocks, it got nearly all right when the wording was familiar, and 4 to 8 in 10 when it wasn’t.</li></ul>" +
      "<h2>What runs on this page</h2><p>The seating program runs live in your browser. It is a JavaScript copy of our checked program, tested to give identical answers on 400 random cases and every recorded example.</p><p>The tiny AI does not run in your browser. Its readings of these sentences were recorded on a laptop beforehand. The chatbot’s answers are its real answers from our test. The name words are new: avoid is now one of the checked building blocks, and pair is handled before the blocks run.</p>";
  function aboutHTML() { return ABOUT + '<h2>The code</h2><p>Everything is open: the tiny model, the seating program, the test sets, and every experiment that worked or didn\u2019t, with the write-ups. <a href="https://github.com/ho3h/seat-intelligence" target="_blank" rel="noopener">github.com/ho3h/seat-intelligence</a></p><p class="fine">Made by Theo Hopkinson: <a href="https://github.com/ho3h" target="_blank" rel="noopener">GitHub</a>, <a href="https://www.linkedin.com/in/theohopkinson/" target="_blank" rel="noopener">LinkedIn</a>, <a href="https://x.com/theohopkinson" target="_blank" rel="noopener">X</a>.</p></div>'; }

    mainClashes = [{ a: M, b: Z, kind: "same", g: "card" }]; mainClashes.kOf = {}; mainClashes.kOf[M] = seats.indexOf(M); mainClashes.kOf[Z] = kp;
    if (SQ) goTo(0, 105, 1.22, true); else goTo(170, 148, 1.2, true);
    document.getElementById("cardpd").hidden = false; var el = document.getElementById("cardtext"); el.textContent = "Seat Intelligence (SI)"; el.hidden = false;
    dirty = true;
  }


  requestAnimationFrame(frameLoop);
  window.__luncheon = { st: st, sea: sea, cam: cam, story: story, play: play, swap: swapSeats, letAI: letAI, wave: wave, stepWave: stepWave,
    render: function () { render(performance.now()); }, sheet: openSheet, clashes: clashes, newPuzzle: newPuzzle, evalSeats: evalSeats, FREE: FREE };
})();
