<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seat Intelligence (SI) social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;1,400&family=Courier+Prime:wght@700&family=Source+Serif+4:wght@600&display=swap">
<style>
  /* The posted chart, redrawn as people saw it, with one change: Zuckerberg moved next to Musk. Landscape 1200x630 (link preview); #sq gives 1080x1350 (feed). */
  :root { --ink:#000; --paper:#fff; --table:#7b6221; --red:#b0261c; --chart:Calibri, Carlito, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden; }
  .chart { position:absolute; font-family:var(--chart); }
  .hdr { position:absolute; left:0; top:0; font-size:14px; color:#555; line-height:1.25; }
  .title { position:absolute; top:20px; width:100%; text-align:center; font-size:18px; }
  .room { position:absolute; left:16px; right:0; top:44px; bottom:0; border:6px solid var(--ink); }
  .tick { position:absolute; left:-22px; width:34px; height:4px; background:var(--ink); }
  .table { position:absolute; left:50%; transform:translateX(-50%); width:15%; top:9%; bottom:8%; background:var(--table); border:2px solid var(--ink); border-radius:14px; }
  .seat { position:absolute; display:flex; align-items:center; gap:5px; font-style:italic; font-size:12px; white-space:nowrap; }
  .seat.l { flex-direction:row-reverse; }
  .chair { width:13px; height:15px; border:1.4px solid var(--ink); border-radius:2px; background:#fff; position:relative; flex:none; }
  .chair::after { content:""; position:absolute; inset:2px 2.5px; border:1px solid var(--ink); }
  .chair.potus { background:#4472c4; }
  .flash { position:absolute; border:3px solid var(--red); border-radius:6px; background:rgba(176,38,28,.06); }
  .pd { position:absolute; font:700 76px/1 "Courier Prime", "Courier New", monospace; color:var(--red); white-space:nowrap; }
  .lead { position:absolute; height:3px; background:var(--red); transform-origin:left center; }
  .mark { position:absolute; font:600 18px/1 "Source Serif 4", Georgia, serif; }
</style>
</head>
<body>
<div class="chart" id="chart"><div class="hdr">Super Intelligence Luncheon<br>Tuesday, September 29, 2026</div><div class="title">Seating Chart | East Room</div><div class="room" id="room"><div class="table"></div></div></div>
<div class="pd" id="pd">p(doom) = 1</div>
<div class="lead" id="lead"></div>
<div class="mark" id="mark">Seat Intelligence (SI)</div>
<script>
(async function () {
  var SQ = location.hash === "#sq";
  var W = innerWidth, H = innerHeight;
  var d = await (await fetch("/luncheon.json").catch(function () { return fetch("../../data/hero/luncheon.json"); })).json();
  var seats = d.seats.map(function (s) { return { side: s.side, row: s.row, name: s.name, org: s.org }; });
  // the one change: Zuckerberg trades seats with Pichai, so he sits right next to Musk
  var zi = seats.findIndex(function (s) { return s.name === "Mark Zuckerberg"; }), pi = seats.findIndex(function (s) { return s.name === "Sundar Pichai"; });
  var tmp = seats[zi].row; seats[zi].row = seats[pi].row; seats[pi].row = tmp;
  var chart = document.getElementById("chart"), room = document.getElementById("room");
  var cw = SQ ? 900 : 650, ch = SQ ? 1050 : 606;
  chart.style.width = cw + "px"; chart.style.height = ch + "px";
  chart.style.left = (SQ ? (W - cw) / 2 : 28) + "px"; chart.style.top = (SQ ? 40 : (H - ch) / 2) + "px";
  if (SQ) { document.querySelector(".hdr").style.fontSize = "18px"; document.querySelector(".title").style.fontSize = "22px"; document.querySelector(".title").style.top = "34px"; room.style.top = "68px"; }
  var rw = room.clientWidth, rh = room.clientHeight, top = rh * 0.115, pitch = (rh * 0.80) / 16, fs = SQ ? 20 : 15.5;
  [0.045, 0.09, 0.5, 0.63, 0.67, 0.84].forEach(function (f) { var t = document.createElement("div"); t.className = "tick"; t.style.top = (f * rh) + "px"; room.appendChild(t); });
  var musk, zuck;
  seats.forEach(function (s) {
    var el = document.createElement("div"); el.className = "seat " + (s.side === "left" ? "l" : "r"); el.style.fontSize = fs + "px";
    var label = s.org ? s.name + " – " + s.org : s.name;
    el.innerHTML = '<span class="chair' + (s.name === "POTUS" ? " potus" : "") + '"' + (SQ ? ' style="width:16px;height:19px"' : "") + '></span><span>' + label + "</span>";
    var y = top + pitch * s.row;
    el.style.top = (y - fs * 0.7) + "px";
    if (s.side === "left") el.style.right = (rw / 2 + rw * 0.075 + 4) + "px"; else el.style.left = (rw / 2 + rw * 0.075 + 4) + "px";
    room.appendChild(el);
    if (s.name === "Elon Musk") musk = { el: el, y: y }; if (s.name === "Mark Zuckerberg") zuck = { el: el, y: y };
  });
  // red flashpoint around Musk and Zuckerberg
  var a = Math.min(musk.y, zuck.y), b = Math.max(musk.y, zuck.y), wMax = Math.max(musk.el.offsetWidth, zuck.el.offsetWidth);
  var f = document.createElement("div"); f.className = "flash";
  var fx = rw / 2 + rw * 0.075 - 4; f.style.left = fx + "px"; f.style.width = (wMax + 16) + "px"; f.style.top = (a - pitch * 0.62) + "px"; f.style.height = (b - a + pitch * 1.24) + "px";
  room.appendChild(f);
  var pd = document.getElementById("pd"), mark = document.getElementById("mark"), lead = document.getElementById("lead");
  var fr = f.getBoundingClientRect();
  if (SQ) {
    var cb = chart.getBoundingClientRect();
    pd.style.fontSize = "96px"; pd.style.left = "0"; pd.style.right = "0"; pd.style.textAlign = "center"; pd.style.top = (cb.bottom + 46) + "px";
    mark.style.right = "64px"; mark.style.bottom = "40px"; mark.style.fontSize = "24px";
    lead.style.display = "none";
  } else {
    var px = 742; pd.style.fontSize = "64px"; pd.style.left = px + "px"; pd.style.top = (fr.top + fr.height / 2 - 31) + "px";
    var x0 = fr.right, y0 = fr.top + fr.height / 2; lead.style.left = x0 + "px"; lead.style.top = y0 + "px"; lead.style.width = (px - x0 - 14) + "px";
    mark.style.right = "40px"; mark.style.bottom = "34px"; mark.style.fontSize = "24px";
  }
})();
</script>
</body>
</html>
