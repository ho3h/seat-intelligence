<style>
  /* Monotone state-dinner stationery: black ink on white card, engraved serif display, a book serif for reading. One caption card over a full-screen chart. Deliberately single-theme. */
  :root { --ink:#151515; --mute:#6b6b68; --paper:#fbfbf9; --soft:#efeeea; --hair:#d6d4ce; --bad:#a8322a; --red:#a8322a; --good:#151515; --blue:#151515;
          --display:"Cormorant Garamond", "EB Garamond", Georgia, serif; --text:"Source Serif 4", Georgia, "Times New Roman", serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); }
  body { font:15.5px/1.55 var(--text); overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  #stage.drag { cursor:grabbing; }
  #stage.can-pick { cursor:pointer; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  button { font:inherit; color:inherit; }
  .btn { background:var(--paper); border:1px solid var(--ink); padding:6px 16px; cursor:pointer; border-radius:0; white-space:nowrap; font-family:var(--text); font-size:14.5px; letter-spacing:.02em; }
  .btn:hover { background:var(--soft); }
  .btn.primary { font-variant:small-caps; letter-spacing:.08em; font-size:16px; }
  .btn.primary { background:var(--ink); color:#fff; }
  .btn.primary:hover { background:#333; }
  .btn.small { padding:3px 10px; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .link { background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; cursor:pointer; font-size:14px; font-family:var(--text); }
  a { color:var(--ink); text-underline-offset:3px; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .nav { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); left:14px; display:flex; flex-direction:column; gap:6px; }
  @media (max-width:1020px) { .nav { display:none; } }
  /* the caption card */
  #cap { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:min(560px, calc(100% - 24px));
         background:var(--paper); border:1px solid var(--ink); box-shadow:0 1px 0 var(--ink), 0 10px 30px rgba(0,0,0,.08); }
  .cap-in { padding:12px 16px 4px; max-height:32vh; overflow:auto; }
  .cap-in h1 { margin:0 0 6px; font:600 28px/1.1 var(--display); letter-spacing:.005em; text-wrap:balance; }
  .cap-in p { margin:0 0 8px; }
  .rule { font:italic 600 21px/1.25 var(--display); margin:0 0 8px !important; }
  .keyl { color:var(--mute); font-size:14px; white-space:nowrap; }
  .dot { display:inline-block; width:17px; height:17px; border-radius:50%; color:#fff; font-size:10.5px; font-weight:600; font-family:var(--text); text-align:center; line-height:17px; margin:0 3px 0 8px; vertical-align:-3px; font-style:normal; }
  .fine { color:var(--mute); font-size:13px; }
  .code { display:block; font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--soft); padding:6px 10px; white-space:pre; margin:4px 0 8px; overflow-x:auto; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 16px 12px; flex-wrap:wrap; }
  .bar .sp { flex:1; }
  .chips { display:flex; gap:6px; }
  .stepper { display:flex; align-items:center; gap:8px; }
  .lvname { font:italic 600 18px/1.1 var(--display); min-width:9em; text-align:center; }
  .dots { display:flex; gap:5px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--hair); display:block; }
  .dots i.on { background:var(--ink); }
  .links { display:flex; gap:16px; flex-wrap:wrap; padding:0 16px 12px; }
  /* p(doom) lives in the frame: a small card with one number and a hairline meter */
  .hud { position:absolute; top:calc(12px + env(safe-area-inset-top, 0px)); right:12px; background:var(--paper); color:var(--ink); border:1px solid var(--hair); padding:8px 12px 7px; min-width:150px; }
  .hud b { display:block; font:italic 600 22px/1.05 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .hud .pbar { display:block; height:3px; background:var(--soft); margin:6px 0 5px; }
  .hud .pbar i { display:block; height:3px; width:0; background:var(--ink); transition:width .5s ease; }
  .hud #hudred { display:block; font-size:11.5px; color:var(--mute); }
  .hud.late { border-color:var(--red); }
  .hud.late b { color:var(--red); }
  .hud.late .pbar i { background:var(--red); }
  .hud.ok b { color:var(--ink); }
  .hud.strike { animation:strike .5s ease-in-out 2; }
  @keyframes strike { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .capclock { display:none; padding:7px 12px 6px; border-bottom:1px solid var(--hair); font-size:12px; color:var(--mute); }
  .capclock b { font:italic 600 16px/1.2 var(--display); color:var(--ink); margin-right:6px; }
  .capclock.late b { color:var(--red); }
  .over { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; background:rgba(251,251,249,.55); }
  .over-in { background:var(--paper); border:1px solid var(--ink); border-top:4px solid var(--red); padding:22px 26px 20px; max-width:min(440px, calc(100% - 32px)); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  .over .pd { font:italic 600 52px/1 var(--display); color:var(--red); margin:0 0 10px; }
  .over p { margin:0 0 14px; }
  .over .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .kick { margin:0 0 4px !important; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); }
  .lede { font:italic 500 20px/1.3 var(--display); margin:0 0 8px !important; }
  /* social card mode (#card 1200x630 link preview, #card-sq 1080x1350 feed post): the live UI, zoomed in, nothing added but a header and the name */
  body.card #cap, body.card .nav, body.card .over, body.card .credit, body.card .toast { display:none !important; }
  body.card .hud { display:block !important; z-index:2; left:auto; right:60px; top:50%; transform:translateY(-50%) scale(2.1); transform-origin:right center; animation:none !important; }
  body.card .fizz { display:none !important; }
  #cardhead, #cardtext { position:absolute; z-index:2; right:60px; text-align:right; }
  #cardhead { top:40px; font:italic 17px/1.35 var(--display); color:var(--mute); }
  #cardhead b { display:block; font:700 21px/1.35 var(--display); font-style:normal; color:var(--ink); }
  #cardtext { bottom:40px; font:600 25px/1 var(--text); color:var(--ink); }
  body.sq .hud { right:52px; top:55%; transform:translateY(-50%) scale(1.75); }
  body.sq #cardhead { right:52px; top:64px; font-size:22px; }
  body.sq #cardhead b { font-size:28px; }
  body.sq #cardtext { right:52px; bottom:60px; font-size:34px; }
  .toast { position:absolute; top:calc(62px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); width:max-content; max-width:min(520px, calc(100vw - 32px)); background:var(--ink); color:#fff; padding:10px 18px; font:italic 500 19px/1.3 var(--display); pointer-events:none; opacity:0; transition:opacity .25s; text-align:center; }
  .toast.on { opacity:1; }
  /* How it works */
  #sheet { position:fixed; inset:0; background:rgba(17,17,17,.35); overflow:auto; }
  .sheet-in { background:var(--paper); max-width:640px; margin:calc(24px + env(safe-area-inset-top, 0px)) auto 24px; border:1px solid var(--ink); position:relative; }
  #sheetclose { position:sticky; top:0; float:right; margin:10px; }
  .pane { padding:18px 22px 22px; }
  .kicker { margin:0 0 6px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .pane h1 { margin:0 0 10px; font:600 32px/1.1 var(--display); text-wrap:balance; }
  .pane h2 { margin:24px 0 8px; font:600 23px/1.2 var(--display); }
  .pane p { margin:0 0 10px; }
  .flow { margin:6px 0 14px; }
  .flow .box { border:1px solid var(--ink); padding:8px 10px; }
  .flow .box b { display:block; }
  .flow .box span { font-size:13.5px; color:var(--mute); }
  .flow .box.hi { background:var(--soft); }
  .flow .arrow { text-align:center; line-height:1; padding:3px 0; color:var(--mute); }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 12px; }
  .fact { border:1px solid var(--ink); padding:8px 10px; min-width:0; }
  .fact b { display:block; font:600 30px/1.05 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .fact span { font-size:13.5px; color:var(--mute); }
  .bars { margin:6px 0 14px; }
  .bars .lab { font-size:14px; margin:6px 0 2px; display:flex; justify-content:space-between; gap:10px; }
  .bars .track { height:10px; background:var(--soft); border:1px solid var(--hair); }
  .bars .fill { height:8px; background:var(--ink); }
  .fig { display:block; width:100%; max-width:320px; height:auto; margin:6px 0 4px; }
  .fig .b { fill:var(--soft); stroke:var(--ink); stroke-width:1.5; }
  .fig .n { fill:var(--paper); stroke:var(--ink); stroke-width:1.8; }
  .fig .w { fill:none; stroke:var(--ink); stroke-width:1.8; }
  .fig .a { stroke:var(--blue); stroke-width:3; }
  .fig .t { fill:var(--mute); font-size:13px; font-family:inherit; }
  .fig .m { fill:var(--ink); font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pane ul { margin:0 0 10px; padding-left:18px; }
  .pane li { margin:0 0 6px; }
  @media (max-width:600px) {
    .hud { display:none !important; }
    .capclock { display:block; }
    .cap-in { padding:10px 12px 2px; max-height:24vh; }
    .cap-in h1 { font-size:24px; }
    .rule { font-size:18px; }
    .bar { padding:6px 12px 10px; }
    .links { padding:0 12px 10px; gap:12px; }
    .hud { padding:6px 10px 6px 6px; gap:8px; }
    .hud svg { width:40px; height:40px; }
    .hud b { font-size:17px; }
    .nav { display:none; }
    .facts { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .toast, .hud .hand { transition:none; } .hud.strike { animation:none; } }

  /* type, third pass: Libre Caslon for the chart, place cards and quotes; Source Serif for reading; Courier Prime for the official numbers */
  :root { --display:"Libre Caslon Text", Georgia, serif; --mono:"Courier Prime", "Courier New", monospace; }
  .cap-in h1 { font:600 22px/1.25 var(--text); letter-spacing:0; }
  .lede { font:italic 400 18px/1.35 var(--display); }
  .rule { font:italic 400 17px/1.4 var(--display); }
  .btn.primary { font-variant:normal; letter-spacing:.01em; font-size:15px; }
  .hud b { font:700 21px/1.1 var(--mono); }
  .hud #hudred { font:12px/1.3 var(--mono); }
  .capclock b { font:700 15px/1.2 var(--mono); }
  .code { font-family:var(--mono); }
  .toast { font:italic 400 16.5px/1.35 var(--display); }
  .over .pd { font:700 46px/1 var(--mono); }
  .lvname { font:italic 400 17px/1.1 var(--display); }
  .pane h1 { font:600 26px/1.2 var(--text); }
  .pane h2 { font:600 19px/1.3 var(--text); }
  .kicker { letter-spacing:0; text-transform:none; font-size:13px; }
  .fact b { font:700 26px/1.1 var(--mono); }

  /* long captions: grow to fit, and when they still overflow, fade the bottom and say so */
  .cap-in { max-height:40vh; position:relative; }
  .cap-in.more { -webkit-mask-image:linear-gradient(to bottom, #000 78%, transparent); mask-image:linear-gradient(to bottom, #000 78%, transparent); }
  .morehint { display:none; position:absolute; left:50%; transform:translateX(-50%); margin-top:-30px; font:13px var(--text); background:var(--ink); color:#fff; padding:3px 10px; pointer-events:none; }
  #cap.has-more .morehint { display:block; }
  @media (max-width:600px) { .cap-in { max-height:50vh; } }

  /* desktop: copy in a left-hand column, the chart in the right-hand side */
  @media (min-width:900px) {
    #cap { left:0; top:0; bottom:0; transform:none; width:min(42vw, 540px); border:0; border-right:1px solid var(--ink); box-shadow:none; display:flex; flex-direction:column; }
    .cap-in { max-height:none; flex:1 1 auto; overflow:auto; padding:13vh 44px 16px; }
    .cap-in h1 { font-size:27px; }
    .cap-in p { font-size:16.5px; }
    .rule, .lede { font-size:19px; }
    .bar { padding:14px 44px 26px; border-top:1px solid #e3e1db; }
    .links { padding:0 44px 26px; }
    .capclock { padding:12px 44px 10px; }
    .morehint { margin-top:-34px; }
    .nav { left:auto; right:14px; }
    .toast { left:calc(min(42vw, 540px) + (100vw - min(42vw, 540px)) / 2); }
  }

  /* made-by credit, bottom right of the chart on desktop; inside the How it works sheet on phones */
  .credit { position:absolute; right:14px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); font:13px/1.2 var(--text); color:var(--mute); display:flex; gap:10px; align-items:baseline; background:rgba(251,251,249,.9); padding:4px 6px; }
  .credit a { color:var(--ink); }
  @media (min-width:900px) { .nav { bottom:calc(46px + env(safe-area-inset-bottom, 0px)); } }
  @media (max-width:899px) { .credit { display:none; } }
  body.card .credit { display:none !important; }

  .capfoot { margin:0; padding:0 16px 12px; color:var(--mute); font-size:12.5px; line-height:1.5; }
  @media (min-width:900px) {
    .cap-in { padding:15vh 52px 20px; }
    .cap-in h1 { font-size:30px; line-height:1.2; margin-bottom:14px; }
    .lede { margin-bottom:26px !important; font-size:20px; }
    .cap-in p { font-size:17px; line-height:1.65; margin-bottom:18px; }
    .rule { margin-bottom:18px !important; }
    .bar { padding:16px 52px 22px; }
    .links { padding:0 52px 24px; }
    .capfoot { padding:0 52px 26px; font-size:13px; }
    #cap { width:min(44vw, 580px); }
    .toast { left:calc(min(44vw, 580px) + (100vw - min(44vw, 580px)) / 2); }
  }

  /* p(doom): bigger, and a short red pulse whenever a move raises it */
  .hud { min-width:170px; }
  .hud b { font-size:26px; display:inline-block; }
  .hud .delta { display:inline-block; margin-left:8px; font:700 15px var(--mono); color:var(--red); vertical-align:3px; }
  .hud.up { animation:pd-up 1.1s ease-out; }
  .hud.down .delta { color:var(--mute); }
  .capclock.up { animation:pd-up 1.1s ease-out; }
  .capclock .delta { margin:0 6px 0 2px; font:700 13px var(--mono); color:var(--red); }
  .capclock.down .delta, .hud.tick .delta, .capclock.tick .delta { color:var(--mute); }
  @keyframes pd-up { 0% { background:var(--red); color:#fff; border-color:var(--red); } 100% { background:var(--paper); } }
  @media (prefers-reduced-motion: reduce) { .hud.up, .capclock.up { animation:none; outline:2px solid var(--red); } }

  /* p(doom) past 1: the meter overcharges. It wobbles, the bar runs with stripes and bubbles fizz off the top */
  .hud .pbar { position:relative; }
  .hud .fizz { display:none; position:absolute; left:0; right:0; top:0; height:0; }
  .hud.boil .fizz { display:block; }
  .hud .fizz i { position:absolute; top:-2px; width:5px; height:5px; border:1.5px solid var(--red); border-radius:50%; opacity:0; animation:fizz 1.1s ease-out infinite; }
  .hud .fizz i:nth-child(1) { left:16%; }
  .hud .fizz i:nth-child(2) { left:43%; width:4px; height:4px; animation-delay:.3s; }
  .hud .fizz i:nth-child(3) { left:66%; animation-delay:.62s; }
  .hud .fizz i:nth-child(4) { left:88%; width:3px; height:3px; animation-delay:.86s; }
  @keyframes fizz { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; } 100% { transform:translateY(-15px); opacity:0; } }
  .hud.boil { border-color:var(--red); transform-origin:50% 0; animation:wobble .3s ease-in-out infinite alternate; }
  .hud.boil.up { animation:pd-up 1.1s ease-out, wobble .3s ease-in-out infinite alternate; }
  .hud.boil .pbar i { background:repeating-linear-gradient(-45deg, var(--red) 0 5px, #cf6a61 5px 10px); background-size:14.14px 14.14px; animation:charge .5s linear infinite; }
  .capclock.boil b { display:inline-block; color:var(--red); animation:wobble .3s ease-in-out infinite alternate; }
  @keyframes wobble { from { transform:rotate(calc(-1 * var(--amp, 1deg))); } to { transform:rotate(var(--amp, 1deg)); } }
  @keyframes charge { to { background-position:14.14px 0; } }
  @media (prefers-reduced-motion: reduce) { .hud.boil, .hud.boil.up, .capclock.boil b, .hud .fizz i, .hud.boil .pbar i { animation:none; } }
</style>

<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="Seating chart of the White House AI lunch"></canvas>
  <div class="nav"><button class="btn small" id="fit" type="button">Lunch table</button><button class="btn small" id="far" type="button">Zoom out</button></div>
  <div class="hud" id="hud" hidden aria-live="polite"><div><b id="doomt"></b><span class="delta" id="hudd"></span><span class="pbar"><i id="doombar"></i><span class="fizz" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span><span id="hudred"></span></div></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section id="cap" aria-label="Story"></section>
  <nav class="credit" aria-label="Made by">by Theo Hopkinson <a href="https://github.com/ho3h" target="_blank" rel="noopener">GitHub</a><a href="https://www.linkedin.com/in/theohopkinson/" target="_blank" rel="noopener">LinkedIn</a><a href="https://x.com/theohopkinson" target="_blank" rel="noopener">X</a></nav>
  <div id="cardhead" hidden>Super Intelligence Luncheon<b>Seating Chart · East Room</b></div><div id="cardtext" hidden></div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="How it works"><div class="sheet-in"><button class="btn small" type="button" id="sheetclose">Close</button><div id="sheetbody"></div></div></div>
